AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Proxies the National Weather Service gridpoint forecast API so the
  jhay-calendar frontend can call it with the headers weather.gov requires.

Globals:
  Function:
    Timeout: 10
    Runtime: python3.13
    MemorySize: 128

Resources:
  WeatherApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost"
          - "http://localhost:8080"
          - "https://jhay.net"
          - "https://calendar.jhay.net"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  WeatherProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: .
      Events:
        Forecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref WeatherApi
            Path: /forecast
            Method: GET
        ForecastHourly:
          Type: HttpApi
          Properties:
            ApiId: !Ref WeatherApi
            Path: /forecast/hourly
            Method: GET

Outputs:
  WeatherApiUrl:
    Description: Base URL for the weather proxy API
    Value: !Sub "https://${WeatherApi}.execute-api.${AWS::Region}.amazonaws.com"
